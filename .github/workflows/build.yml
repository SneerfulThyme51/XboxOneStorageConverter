name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - run: nuget restore "XBOX One Drive Converter.sln"
      - run: msbuild "XBOX One Drive Converter.sln" /p:Configuration=Release
      - uses: actions/upload-artifact@v4
        with:
          name: XboxOneStorageConverter
          path: bin/Release/
